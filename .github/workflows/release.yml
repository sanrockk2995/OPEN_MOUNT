name: Build & Release OpenMount

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WinFsp Driver on Runner
        run: |
          Start-Process msiexec.exe -ArgumentList '/i redist\winfsp.msi /qn /norestart' -Wait

      - name: Restore Dependencies
        run: dotnet restore OpenMount.sln

      - name: Run Test Suite
        run: dotnet test OpenMount.sln -c Release --no-restore --verbosity normal

      - name: Publish Standalone Executable (Single-File Self-Contained)
        run: |
          dotnet publish src/OpenMount.Windows/OpenMount.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/standalone

          New-Item -ItemType Directory -Path dist/release-assets -Force | Out-Null
          Copy-Item "dist/standalone/OpenMount.Windows.exe" "dist/release-assets/OpenMount.exe" -Force

      - name: Publish Portable Zip Bundle
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $tag) { $tag = "v1.1.0" }

          dotnet publish src/OpenMount.Windows/OpenMount.Windows.csproj -c Release -o dist/portable
          dotnet publish src/OpenMount.Cli/OpenMount.Cli.csproj -c Release -o dist/portable
          Copy-Item "README.md" "dist/portable/README.md" -Force

          $zipName = "OpenMount-$tag-win-x64.zip"
          Compress-Archive -Path "dist/portable/*" -DestinationPath "dist/release-assets/$zipName" -CompressionLevel Optimal

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: OpenMount ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/release-assets/OpenMount.exe
            dist/release-assets/*.zip
          body: |
            # OpenMount ${{ github.ref_name || github.event.inputs.tag_name }}

            High-Performance Virtual Cloud Storage for Windows, powered by the WinFsp kernel driver.

            ### Downloads:
            - **`OpenMount.exe`**: 100% standalone, single-file self-contained executable. Double-click and run directly without extraction or pre-installing .NET or WinFsp.
            - **`OpenMount-*-win-x64.zip`**: Complete portable bundle including GUI app, CLI runner, and redistributable installer.

            ### Features:
            - **Single-File Self-Contained Binary**: Zero prerequisites; embeds .NET 8 desktop runtime and WinFsp installer.
            - **Modern Dark & Light Theme**: Toggle dynamically via `🌙 Dark Mode` / `☀️ Light Mode` button or system tray.
            - **Integrated WinFsp Kernel Auto-Installer**: Prompts and installs WinFsp silently via UAC if not detected.
            - **Anti-Clipping DPI Layout**: Clear button spacing across all system scaling settings.
            - **Multi-Cloud Storage Suite**: Google Drive, AWS S3 / MinIO, WebDAV, SFTP, FTP/FTPS, pCloud, and Local folder mounting.
            - **System Tray Daemon & Windows Auto-Start**: Runs in background, auto-mounts on boot with network retry resiliency.
            - **File Explorer Storage Metrics**: Displays NTFS volume capacity and usage bars in Windows File Explorer.
            - **Hardware-Backed DPAPI Encryption**: Machine/user-isolated credential encryption.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
